trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'azure-service-connection'   # change to your service connection name
  webAppName: 'REPLACE_WITH_TERRAFORM_OUTPUT_app_name'

stages:
  - stage: Build
    jobs:
      - job: BuildJar
        steps:
          - task: Maven@4
            displayName: Build and test
            inputs:
              mavenPomFile: pom.xml
              goals: verify
              javaHomeOption: JDKVersion
              jdkVersionOption: '1.17'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
          - publish: $(System.DefaultWorkingDirectory)/target/app.jar
            artifact: drop

  - stage: Deploy
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployWebApp
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webAppLinux
                    appName: $(webAppName)
                    package: $(Pipeline.Workspace)/drop/app.jar
